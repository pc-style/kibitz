<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Learn chess from the first move, play bots or a friend by link, and get every move of your games graded by Stockfish. Free, no account." />
    <meta property="og:title" content="Kibitz · learn, play and review chess" />
    <meta property="og:description" content="Learn chess from the first move, play bots or a friend by link, and get every move of your games graded. Free, no account." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kibitz" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Kibitz · learn, play and review chess</title>
    <script>
      // Apply saved look before first paint (src/settings.ts owns these keys after load).
      try {
        const root = document.documentElement;
        const saved = JSON.parse(localStorage.getItem('kibitz:settings') || '{}');
        const legacy = localStorage.getItem('kibitz:theme');
        const theme = saved.theme || (legacy && legacy !== 'felt' ? legacy : null);
        root.dataset.theme = theme || (legacy ? 'classic' : matchMedia('(prefers-color-scheme: light)').matches ? 'paper' : 'classic');
        if (saved.pieces) root.dataset.pieces = saved.pieces;
        if (saved.motion === false) root.dataset.motion = 'off';
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
